name: Validate port source and evidence
on:
  workflow_dispatch:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m unittest discover -s oneos/scripts -p 'test_*py'
      - run: python3 -m unittest discover -s tests -p 'test_*py'
      - run: python3 tools/verify_repository.py
